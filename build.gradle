plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '0.1.0'
group = 'com.ltw.airtransport'
base { archivesName = 'ltwairtransport' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.235'
    runs {
        client { client() }
        server { server() }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ltwairtransport'
        }
    }
    mods { ltwairtransport { sourceSet sourceSets.main } }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('runServer') { standardInput = System.in }
